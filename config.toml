# tokcat config — P2 (live metrics + cat animation + vLLM direct fallback)

[display]
title = "runcater"

[poll]  # 1s polling; vLLM direct fallback after N consecutive primary failures
interval = 1.0
timeout = 2.0
primary = "http://192.168.1.221:8000/api/live"
fallback = "http://192.168.1.221:8001/metrics"
fallback_after = 3  # (P2) 3회 연속 실패(~3s) 시 폴백, 1회 성공 시 복귀

[speed]  # gputils core.py 속도 모델 포트 (동일 파라미터)
tok_cap = 40.0
weight_tok = 0.6
weight_cache = 0.3
weight_wait = 0.1
ema_alpha = 0.5
band_run = 30
band_sprint = 70
band_overload = 91
wait_overload = 1

[cat]
frames_dir = "cat_frames"  # 앱 디렉터리 상대 (RunCat, runcat-dev/RunCatNeo, Apache-2.0)
width = 150                # 높이 = width * 36/56 (56:36 스프라이트 비율)
color = "0xf0f0f8"         # gputils 기본 색

[color]
bg = "0x0b0e13"
fg = "0xe8eef4"
dim = "0x7d8a97"
accent = "0x4cc38a"
warn = "0xe5c07b"
error = "0xe06c75"
badge_bg = "0x123524"

[font]
title_size = 22
time_size = 18
mono_size = 18
mono_small_size = 14
badge_size = 14
