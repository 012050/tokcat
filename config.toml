# tokcat config — P4 (new layout: cat TL, KV gauge TR, metrics C, request
# list BL, token-rate graph BR + vLLM direct fallback)

[display]
title = "tokcat"
graph_max_tok_s = 100  # (P4) token-rate graph fixed Y-axis max (tok/s); above clamps to top

[poll]  # 1s polling; vLLM /metrics = all metrics (required), tokenbills =
# in-flight list only (best-effort — down -> "n/a" + badge "· vLLM")
interval = 1.0
timeout = 2.0
metrics = "http://192.168.1.221:8001/metrics"    # (P5) vLLM direct — 6 metrics
inflight = "http://192.168.1.221:8000/api/live"  # (P5) tokenbills — in-flight list

[speed]  # gputils core.py 속도 모델 포트 (동일 파라미터)
tok_cap = 40.0
weight_tok = 0.6
weight_cache = 0.3
weight_wait = 0.1
ema_alpha = 0.5
band_run = 30
band_sprint = 70
band_overload = 91
wait_overload = 1

[cat]
frames_dir = "cat_frames"  # 앱 디렉터리 상대 (RunCat, runcat-dev/RunCatNeo, Apache-2.0)
width = 150                # 높이 = width * 36/56 (56:36 스프라이트 비율)
color = "0xf0f0f8"         # gputils 기본 색

[color]
bg = "0x0b0e13"
fg = "0xe8eef4"
dim = "0x7d8a97"
accent = "0x4cc38a"
warn = "0xe5c07b"
error = "0xe06c75"
badge_bg = "0x123524"
kv = "0xe5c07b"  # 그래프 KV 사용률 % 라인 (warn와 동일 — 2026-11-28)

[font]
title_size = 22
time_size = 18
mono_size = 18
mono_small_size = 14
mono_xs_size = 12   # in-flight request list (P4)
badge_size = 14
