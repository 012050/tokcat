# tokcat config — P0 (layout/colors). Poll endpoints used from P1.

[display]
title = "runcater"
status_text = "P0"   # badge text (P1: ONLINE/OFFLINE/...)

[poll]  # P1: primary + fallback, 1s polling
interval = 1.0
primary = "http://192.168.1.221:8000/api/live"
fallback = "http://192.168.1.221:8001/metrics"

[color]
bg = "0x0b0e13"
fg = "0xe8eef4"
dim = "0x7d8a97"
accent = "0x4cc38a"
warn = "0xe5c07b"
error = "0xe06c75"
badge_bg = "0x123524"

[font]
title_size = 22
time_size = 18
mono_size = 18
mono_small_size = 14
badge_size = 14
